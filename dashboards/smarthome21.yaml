  - type: sections
    max_columns: 1
    title: Garage Door
    path: garage-door
    sections:
      - type: grid
        cards:
          - type: custom:mushroom-title-card
            title: Double Garage Door
            title_tap_action:
              action: none
            subtitle_tap_action:
              action: none
            alignment: center
          - type: custom:mushroom-template-card
            entity: cover.double_garage_door
            primary: DOUBLE GARAGE DOOR
            secondary: |
              {% if is_state('cover.double_garage_door','open') %}
                OPEN
              {% else %}
                CLOSED
              {% endif %}
            icon: mdi:garage
            tap_action:
              action: call-service
              service: cover.toggle
              target:
                entity_id: cover.double_garage_door
            hold_action:
              action: more-info
            grid_options:
              columns: 12
              rows: 2
            vertical: true
            features_position: bottom
            card_mod:
              style: |
                /* ================= BASE CARD ================= */
                ha-card {
                  position: relative;
                  overflow: hidden;
                  height: 190px;
                  border-radius: 26px;
                  background: linear-gradient(180deg,#e5e5e5,#bdbdbd);
                  box-shadow: 0 18px 40px rgba(0,0,0,0.45);
                  cursor: pointer;
                }
                ha-card > * {
                  position: relative;
                  z-index: 5;
                  pointer-events: none;
                }
                /* ================= GARAGE DOOR PANEL ================= */
                ha-card::before {
                  content: "";
                  position: absolute;
                  inset: 0;
                  z-index: 1;

                  background:
                    repeating-linear-gradient(
                      to bottom,
                      rgba(255,255,255,0.18),
                      rgba(255,255,255,0.18) 2px,
                      transparent 2px,
                      transparent 26px
                    ),
                    linear-gradient(
                      180deg,
                      {% if is_state('cover.double_garage_door','open') %}
                        #1fa463,
                        #0f5a34
                      {% else %}
                        #c62828,
                        #5a0000
                      {% endif %}
                    );

                  transform:
                    {% if is_state('cover.double_garage_door','open') %}
                      translateY(-100%)
                    {% else %}
                      translateY(0)
                    {% endif %};
                  transition: transform 1.3s cubic-bezier(.4,0,.2,1);

                  box-shadow:
                    inset 0 -14px 22px rgba(0,0,0,0.45),
                    0 8px 22px rgba(0,0,0,0.55),
                    0 14px 28px rgba(0,0,0,0.35);

                  border-bottom-left-radius: 6px;
                  border-bottom-right-radius: 6px;
                }
                /* ================= STATUS LIGHT ================= */
                ha-card::after {
                  content: "";
                  position: absolute;
                  left: 50%;
                  transform: translateX(-50%);
                  bottom: 14px;
                  width: 72px;
                  height: 6px;
                  border-radius: 6px;
                  z-index: 4;
                  background:
                    {% if is_state('cover.double_garage_door','open') %}
                      linear-gradient(90deg,#00e676,#00c853)
                    {% else %}
                      linear-gradient(90deg,#ff5252,#b71c1c)
                    {% endif %};
                  box-shadow:
                    {% if is_state('cover.double_garage_door','open') %}
                      0 0 18px rgba(0,230,118,0.9)
                    {% else %}
                      0 0 16px rgba(255,82,82,0.85)
                    {% endif %};
                }
                /* ================= ICON ================= */
                mushroom-shape-icon::part(icon) {
                  --mdc-icon-size: 46px;
                  color: white;
                  opacity: 0.95;
                  margin-top: 16px;
                  text-shadow: 0 0 10px rgba(0,0,0,0.6);

                  {% if is_state('cover.double_garage_door','open') %}
                    animation: garage-pulse 1.6s ease-in-out infinite;
                    animation-delay: 3s;
                  {% endif %}
                }
                @keyframes garage-pulse {
                  0% { filter: drop-shadow(0 0 0 rgba(0,230,118,0)); }
                  50% { filter: drop-shadow(0 0 26px rgba(0,230,118,1)); }
                  100% { filter: drop-shadow(0 0 0 rgba(0,230,118,0)); }
                }
                /* ================= TEXT ================= */
                .primary {
                  font-size: 22px;
                  font-weight: 900;
                  letter-spacing: 1px;
                  color: white;
                  text-shadow: 0 3px 10px rgba(0,0,0,0.75);
                }
                .secondary {
                  margin-top: 4px;
                  font-size: 13px;
                  letter-spacing: 4px;
                  font-weight: 800;
                  color:
                    {% if is_state('cover.double_garage_door','open') %}
                      #00e676
                    {% else %}
                      #ff8a80
                    {% endif %};
                  text-shadow: 0 0 8px rgba(0,0,0,0.6);
                }
