###############################################################################
# Smart Home 21 - Master Dashboard (Lovelace, sections view)
# ---------------------------------------------------------------------------
# Drop-in dashboard for fresh Home Assistant installs.
# Host this file in your repo and pull updates via git.
#
# INSTALL (YAML mode):
#   1. Save this file as e.g. /config/dashboards/smarthome21.yaml
#   2. In configuration.yaml add:
#        lovelace:
#          mode: storage          # keep the default dashboard editable in the UI
#          dashboards:
#            smarthome21:
#              mode: yaml
#              title: Smart Home 21
#              icon: mdi:home-assistant
#              show_in_sidebar: true
#              filename: dashboards/smarthome21.yaml
#   3. Restart HA (or Developer Tools > YAML > Reload Dashboards).
#      To update later: git pull, then reload dashboards.
#
# HACS DEPENDENCIES (install BEFORE loading or cards show "custom element not found"):
#   Cards : button-card, Mushroom, card-mod, calendar-card-pro, fold-entity-row
#   Themes: ios-light-mode-red-alternative,
#           Frosted Glass (Light / Lite / Dark Lite / Light Lite), Google Theme
#
# ENTITY IDs: the switch.* / climate.* / cover.* / scene.* IDs below come from a
#   reference install and WILL differ per house. Recommended workflow: on each
#   new build, rename the device entities to match these IDs
#   (Settings > Devices & Services > Entities > rename) and the whole dashboard
#   "just works". Otherwise edit the IDs per job.
#
# ROOM IMAGES: picture-glance cards expect images at
#   /config/www/smarthome21/rooms/<room>.jpg  (served as /local/smarthome21/rooms/..)
###############################################################################

views:
