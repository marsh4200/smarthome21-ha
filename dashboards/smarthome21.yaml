          # Calendar entity below is install-specific - repoint to the new
          # site's calendar.* entity (or remove this card) on each job.
          - entities:
              - entity: calendar.polor_mail_com
            days_to_show: 6
            weather:
              position: date
              date:
                show_conditions: true
                show_high_temp: true
                show_low_temp: false
                icon_size: 14px
                font_size: 12px
                color: var(--primary-text-color)
              event:
                show_conditions: true
                show_temp: true
                icon_size: 14px
                font_size: 12px
                color: var(--primary-text-color)
